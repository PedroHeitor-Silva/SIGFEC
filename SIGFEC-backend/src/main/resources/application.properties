# URL de conex�o (5432 � a porta padr�o do Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/sigfec_db
spring.datasource.username=postgres
spring.datasource.password=root

# Configura��es do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configura��es de Batch Insert para Performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=false

# JWT
sigfec.jwt.secret=CHANGE-ME-IN-PRODUCTION-this-must-be-at-least-32-bytes-long-secret-key
sigfec.jwt.expiration-ms=28800000

# Jackson — aceita null para campos primitivos (boolean/int) usando valor default
# Evita erro "Cannot map null into type boolean" em payloads parciais
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ASAAS - gateway de pagamento
# Chave vem de variavel de ambiente OU do arquivo local nao versionado asaas-local.properties
asaas.api-key=${ASAAS_API_KEY:}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}

# Importa configuracao local com a chave Asaas (arquivo fora do git)
spring.config.import=optional:classpath:asaas-local.properties