# URL de conex�o (5432 � a porta padr�o do Postgres)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigfec_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# Configura��es do Hibernate
spring.jpa.hibernate.ddl-auto=update
# show-sql desligado por padr�o (evita poluir console e vazar estrutura).
# Para depurar SQL, mude para true temporariamente.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configura��es de Batch Insert para Performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=false

# JWT
sigfec.jwt.secret=${SIGFEC_JWT_SECRET:CHANGE-ME-IN-PRODUCTION-this-must-be-at-least-32-bytes-long-secret-key}
sigfec.jwt.expiration-ms=28800000

# Jackson — aceita null para campos primitivos (boolean/int) usando valor default
# Evita erro "Cannot map null into type boolean" em payloads parciais
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ASAAS - gateway de pagamento
# Chave vem de variavel de ambiente OU do arquivo local nao versionado asaas-local.properties
asaas.api-key=${ASAAS_API_KEY:}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
# Token de verificacao do webhook (configurar igual no painel Asaas). Vazio = sem verificacao (dev).
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}

# Importa configuracao local com a chave Asaas (arquivo fora do git)
spring.config.import=optional:classpath:asaas-local.properties
# Fila do patio - locais para onde um veiculo pode ser chamado (separados por virgula)
sigfec.fila.locais-chamada=Balan\u00e7a 1,Balan\u00e7a 2

# Servidor (deploy): porta configuravel e respeita X-Forwarded-* do proxy HTTPS (Caddy)
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Origens extras liberadas no CORS (ex.: https://*.sslip.io), separadas por virgula
sigfec.cors.origens-extras=${SIGFEC_CORS_ORIGENS:}
